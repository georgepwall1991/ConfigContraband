name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore ConfigContraband.slnx

      - name: Build
        run: dotnet build ConfigContraband.slnx --configuration Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Verify showcase diagnostic contract
        run: bash scripts/verify-showcase.sh

      - name: Verify formatting
        run: dotnet format ConfigContraband.slnx --verify-no-changes --no-restore --verbosity minimal

      - name: Test
        run: dotnet test ConfigContraband.slnx --configuration Release --no-build --logger trx --results-directory TestResults --collect:"XPlat Code Coverage"

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          directory: TestResults
          fail_ci_if_error: true
          use_oidc: true

      - name: Pack
        run: |
          dotnet pack src/ConfigContraband/ConfigContraband.csproj --configuration Release --no-build --output artifacts/packages
          dotnet pack src/ConfigContraband.Tool/ConfigContraband.Tool.csproj --configuration Release --no-build --output artifacts/packages

      - name: Verify package payloads
        run: bash scripts/verify-packages.sh artifacts/packages

      - name: Verify packed tool end to end
        run: bash scripts/verify-packed-tool.sh artifacts/packages

      - name: Setup .NET 8 compatibility SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Verify .NET 8 analyzer host compatibility
        run: bash scripts/verify-net8-analyzer-host.sh

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: packages
          path: artifacts/packages
